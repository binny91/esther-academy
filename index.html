<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="האקדמיה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>האקדמיה של אסתר</title>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1c2230;--mute:#6b7280;--line:#e7e2d8;--acc:#2f6f62;--acc-soft:#e3efeb;--gold:#b8863b;--ok:#2e7d4f;--bad:#c0392b;--okbg:#e7f4ec;--badbg:#fbeae7;--chip:#efebe3;--shadow:0 1px 2px rgba(20,25,35,.05),0 4px 16px rgba(20,25,35,.06);--fs:17px}
[data-theme=dark]{--bg:#11151c;--card:#1a2029;--ink:#ebe8e2;--mute:#9aa3af;--line:#2a313c;--acc:#62b7a4;--acc-soft:#1d3330;--gold:#d9ab5c;--ok:#5cc28a;--bad:#ef7b6c;--okbg:#16342a;--badbg:#3b201c;--chip:#232a35;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;line-height:1.6;min-height:100vh;transition:background .25s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc)}
.wrap{max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) max(18px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.read{max-width:700px;margin:0 auto}
h1{font-size:1.65rem;line-height:1.25;margin:.2em 0 .15em;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.12rem;margin:1.6em 0 .6em;font-weight:650}
h3{font-size:1.1rem;margin:1.4em 0 .4em}
.sub{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.grid.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:620px) and (max-width:899px){.grid.g3{grid-template-columns:1fr 1fr}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:40px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);font-size:1.1rem}
.iconbtn.on{background:var(--acc);color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:.95rem;padding:8px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:14px;padding:13px 20px;font-weight:600;font-size:1rem;min-height:48px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.92rem;border-radius:11px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.emo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;flex:none}
.track{display:flex;flex-direction:column;gap:12px;text-align:right;width:100%}
.track .t{font-weight:650;font-size:1.05rem}
.muted{color:var(--mute)}
.small{font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:14px 8px}
.stat b{display:block;font-size:1.35rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--mute)}
.ring{width:64px;height:64px;margin:0 auto 4px;display:block}
.hero{background:linear-gradient(135deg,var(--acc),#24564c);color:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow);text-align:right;width:100%;display:block}
[data-theme=dark] .hero{background:linear-gradient(135deg,#2c5f55,#1d3f39)}
.hero .k{opacity:.8;font-size:.85rem}
.hero .t{font-size:1.2rem;font-weight:650;margin:2px 0 10px}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar>i{background:#fff}
.lesson-item{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:right;border-bottom:1px solid var(--line)}
.lesson-item:last-child{border-bottom:0}
.num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);font-weight:650;font-size:.9rem;flex:none}
.num.done{background:var(--acc);color:#fff}
.num.lock{opacity:.6}
.lesson-item.locked{opacity:.55}
.score{font-size:.8rem;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.lesson-body p{margin:.7em 0}
.lesson-body ul{margin:.5em 0;padding-inline-start:1.3em}
.lesson-body li{margin:.3em 0}
.lesson-body h3{color:var(--acc)}
.callout{background:var(--acc-soft);border-radius:14px;padding:12px 16px;margin:1em 0}
.example{border-inline-start:4px solid var(--gold);background:var(--card);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);margin:1.4em 0}
.example .lbl,.terms .lbl{font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.02em}
.terms dl{margin:.4em 0 0}
.terms dt{font-weight:650;margin-top:.7em}
.terms dd{margin:0;color:var(--mute)}
.saying{background:rgba(184,134,59,.16);border-radius:8px;box-shadow:0 0 0 6px rgba(184,134,59,.16)}
textarea,input[type=text],input[type=search],select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;font-size:1rem;transition:background .15s,border-color .15s}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:12px 16px;margin-top:6px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.flash{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;cursor:pointer;user-select:none}
.flash .term{font-size:1.5rem;font-weight:700}
.flash .def{font-size:1.05rem;margin-top:14px;line-height:1.6}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:20}
#tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;color:var(--mute);padding:4px 0;position:relative}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--acc)}
#tabs .badge{position:absolute;top:0;left:calc(50% - 22px);background:var(--gold);color:#fff;font-size:.65rem;border-radius:9px;padding:0 5px;min-width:17px;line-height:17px}
#modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
@media(min-width:620px){#modal{align-items:center}}
#modal .sheet{background:var(--bg);border-radius:22px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.soon{opacity:.72}
.soon .emo{filter:grayscale(.4)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:.9rem}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.set{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set label{font-weight:600}
.week{display:flex;gap:6px;justify-content:center;margin-top:6px}
.week i{width:9px;height:9px;border-radius:50%;background:var(--chip)}
.week i.on{background:var(--gold)}
.disc{font-size:.78rem;color:var(--mute);text-align:center;margin-top:28px;line-height:1.5}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.gl-item{padding:12px 0;border-bottom:1px solid var(--line)}
.gl-item:last-child{border-bottom:0}
.gl-item b{font-size:1.02rem}
.gl-item p{margin:.2em 0 .1em;color:var(--mute)}
mark{background:rgba(184,134,59,.3);color:inherit;border-radius:3px}
.loader{display:flex;align-items:center;justify-content:center;min-height:70vh;color:var(--mute)}
</style>
</head>
<body>
<div id="app"><div class="loader">טוען…</div></div>
<nav id="tabs"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="content/index.js"></script>
<script>
'use strict';
const KEY='esther-academy-v1', NAME='אסתר', DAY=864e5;
const T={}; window.ACADEMY={addTrack(t){T[t.id]=t;}};
const $app=document.getElementById('app');
const DEF=()=>({v:1,lessons:{},bookmarks:{},notes:{},cards:{},days:{},custom:[],settings:{theme:'auto',font:1,goal:1,rate:1,unlockAll:false},last:null,created:Date.now()});
let S=loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.v){const d=DEF();return Object.assign(d,x,{settings:Object.assign(d.settings,x.settings||{})});}}catch(e){}return DEF();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('לא הצלחתי לשמור. ייתכן שהאחסון מלא.');}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const norm=s=>String(s||'').replace(/[\u0591-\u05C7]/g,'').replace(/[״"׳'\-–]/g,'').toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,9);
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){const k=dk();return S.days[k]||(S.days[k]={lessons:0,quizzes:0,reviews:0});}
function bump(kind,n){today()[kind]+=(n||1);save();}
function active(k){const d=S.days[k];return !!d&&(d.lessons+d.quizzes+d.reviews)>0;}
function streak(){let n=0,d=new Date();if(!active(dk(d)))d=new Date(Date.now()-DAY);while(active(dk(d))){n++;d=new Date(d.getTime()-DAY);}return n;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- content model ---------- */
function tracks(){return (window.ACADEMY_TRACKS||[]).map(id=>T[id]).filter(t=>t&&t.lessons&&t.lessons.length);}
const lkey=(tid,lid)=>tid+'/'+lid;
function L(key){return S.lessons[key]||null;}
function isDone(key){const x=L(key);return !!(x&&x.done);}
function findLesson(tid,lid){const t=T[tid];if(!t)return null;const i=t.lessons.findIndex(l=>String(l.id)===String(lid));return i<0?null:{t,l:t.lessons[i],i};}
function unlocked(t,i){if(S.settings.unlockAll||i===0)return true;const k=lkey(t.id,t.lessons[i].id);if(L(k))return true;return isDone(lkey(t.id,t.lessons[i-1].id));}
function trackDone(t){return t.lessons.filter(l=>isDone(lkey(t.id,l.id))).length;}
function trackPct(t){return Math.round(100*trackDone(t)/t.lessons.length);}
function trackAvg(t){const s=t.lessons.map(l=>L(lkey(t.id,l.id))).filter(x=>x&&x.quiz).map(x=>x.quiz.best);return s.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length):null;}
function nextLesson(t){for(let i=0;i<t.lessons.length;i++){if(!isDone(lkey(t.id,t.lessons[i].id))&&unlocked(t,i))return t.lessons[i];}return null;}
function custom(cid){return S.custom.find(c=>c.id===cid);}
function customPct(c){return c.lessons.length?Math.round(100*c.lessons.filter(l=>l.done).length/c.lessons.length):0;}

/* ---------- flashcards (Leitner) ---------- */
const IV=[0,1,2,4,8,16,32,64];
function allTerms(){const out=[];tracks().forEach(t=>t.lessons.forEach(l=>(l.terms||[]).forEach(([term,def])=>out.push({id:lkey(t.id,l.id)+'#'+term,term,def,tid:t.id,lid:l.id,src:t.title,lt:l.title,go:'lesson/'+t.id+'/'+l.id}))));
 S.custom.forEach(c=>(c.cards||[]).forEach(k=>out.push({id:'c:'+c.id+'#'+k.id,term:k.term,def:k.def,tid:'c:'+c.id,src:c.title,lt:'',go:'custom/'+c.id})));return out;}
function deck(){return allTerms().filter(c=>c.tid.startsWith('c:')||L(lkey(c.tid,c.lid))&&L(lkey(c.tid,c.lid)).read);}
function dueCards(){const now=Date.now();return deck().filter(c=>((S.cards[c.id]||{}).due||0)<=now);}
function grade(id,knew){const c=S.cards[id]||{box:0,due:0,n:0};c.n=(c.n||0)+1;if(knew){c.box=Math.min((c.box||0)+1,IV.length-1);c.due=Date.now()+IV[c.box]*DAY-36e5;}else{c.box=0;c.due=Date.now();}S.cards[id]=c;bump('reviews');}

/* ---------- speech ---------- */
let SP=null;
function heVoice(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];return vs.find(v=>/^he|^iw/i.test(v.lang))||null;}
function canSpeak(){return 'speechSynthesis' in window;}
function stopSpeak(){SP=null;try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('.saying').forEach(e=>e.classList.remove('saying'));const b=document.getElementById('sayBtn');if(b)b.classList.remove('on');}
function speak(){if(SP){stopSpeak();return;}if(!canSpeak()){toast('הקראה לא נתמכת במכשיר הזה');return;}
 const els=[...document.querySelectorAll('[data-say]')];let i=0;SP={};const v=heVoice();if(!v)toast('לא נמצא קול בעברית. אפשר להוסיף קול עברי בהגדרות המכשיר.');
 document.getElementById('sayBtn').classList.add('on');
 const next=()=>{if(!SP)return;document.querySelectorAll('.saying').forEach(e=>e.classList.remove('saying'));if(i>=els.length){stopSpeak();return;}const el=els[i++];el.classList.add('saying');el.scrollIntoView({block:'center',behavior:'smooth'});
  const u=new SpeechSynthesisUtterance(el.textContent);u.lang='he-IL';if(v)u.voice=v;u.rate=S.settings.rate;u.onend=next;u.onerror=next;speechSynthesis.speak(u);};
 speechSynthesis.cancel();setTimeout(next,60);}
if(canSpeak())speechSynthesis.onvoiceschanged=()=>{};

/* ---------- theme ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const th=S.settings.theme==='auto'?(mq.matches?'dark':'light'):S.settings.theme;document.documentElement.dataset.theme=th;document.querySelector('meta[name=theme-color]').content=th==='dark'?'#11151c':'#f6f4ef';document.documentElement.style.setProperty('--fs',[15,17,19,21][S.settings.font]+'px');}
mq.addEventListener&&mq.addEventListener('change',applyTheme);

/* ---------- rendering helpers ---------- */
function blocks(txt){const out=[];let ul=null;String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{
 if(s.startsWith('- ')){if(!ul){ul=[];out.push(ul);}ul.push(s.slice(2));return;}ul=null;
 if(s.startsWith('## '))out.push('<h3 data-say>'+fmt(s.slice(3))+'</h3>');else if(s.startsWith('> '))out.push('<div class="callout" data-say>'+fmt(s.slice(2))+'</div>');else out.push('<p data-say>'+fmt(s)+'</p>');});
 return out.map(b=>Array.isArray(b)?'<ul>'+b.map(x=>'<li data-say>'+fmt(x)+'</li>').join('')+'</ul>':b).join('');}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}
function ring(v,max){const p=Math.min(1,max?v/max:0),r=26,c=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--chip)" stroke-width="7"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">'+v+'/'+max+'</text></svg>';}
function emo(e,col){return '<div class="emo" style="background:'+(col||'#2f6f62')+'22">'+e+'</div>';}
function back(to,label){return '<button class="back" data-go="'+to+'">→ '+esc(label)+'</button>';}
function greet(){const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';}
const IC={home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
review:'<rect x="4" y="6" width="13" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3h10a2 2 0 0 1 2 2v12" fill="none" stroke="currentColor" stroke-width="1.8"/>',
gloss:'<circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
me:'<path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
set:'<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'};
function tabs(cur){const due=dueCards().length;const t=[['','home','בית'],['review','review','חזרה'],['glossary','gloss','מילון'],['me','me','שלי'],['settings','set','הגדרות']];
 document.getElementById('tabs').innerHTML=t.map(([h,i,n])=>'<button data-go="'+h+'" class="'+(cur===h?'on':'')+'"><svg viewBox="0 0 24 24">'+IC[i]+'</svg>'+n+(i==='review'&&due?'<span class="badge">'+due+'</span>':'')+'</button>').join('');}

/* ---------- views ---------- */
const V={quiz:null,sess:null,gq:'',gt:'all'};
function render(){stopSpeak();closeModal();const p=(location.hash.slice(1)||'/').split('/').filter(Boolean).map(decodeURIComponent);const r=p[0]||'';
 let html;try{html=(VIEWS[r]||VIEWS[''])(p);}catch(e){console.error(e);html='<div class="empty">משהו השתבש. <button class="btn sm" data-go="">לדף הבית</button></div>';}
 $app.innerHTML='<div class="wrap fade">'+html+'</div>';tabs(['review','glossary','me','settings'].includes(r)?r:(r===''?'':null));window.scrollTo(0,0);after(r);}

function relDay(t){const d=Math.round((new Date(dk(new Date(t)))-new Date(dk()))/DAY);return d<=0?'היום':d===1?'מחר':'בעוד '+d+' ימים';}
function glossList(){const q=norm(V.gq);let items=allTerms().filter(c=>V.gt==='all'||c.tid===V.gt);if(q)items=items.filter(c=>norm(c.term).includes(q)||norm(c.def).includes(q));
 const seen=new Set();items=items.filter(c=>{const k=norm(c.term)+'|'+c.tid;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>a.term.localeCompare(b.term,'he'));
 const hl=s=>{const e=esc(s);if(!V.gq.trim())return e;const r=V.gq.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return e.replace(new RegExp('('+esc(r)+')','g'),'<mark>$1</mark>');}catch(x){return e;}};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newQuiz(k,l){return {k,i:0,picked:null,ans:[],qs:l.quiz.map(([q,o,a,e])=>{const idx=shuffle(o.map((_,j)=>j));return {q,o:idx.map(j=>o[j]),a:idx.indexOf(a),e};})};}

function finishQuiz(){const Q=V.quiz,k=Q.k,x=S.lessons[k]||(S.lessons[k]={});const sc=Math.round(100*Q.ans.filter(a=>a.ok).length/Q.qs.length);
 const first=!x.done;x.read=x.read||Date.now();x.quiz={best:Math.max(sc,(x.quiz||{}).best||0),last:sc,attempts:((x.quiz||{}).attempts||0)+1,at:Date.now()};x.done=true;x.doneAt=x.doneAt||Date.now();
 if(first)today().lessons++;bump('quizzes');}

 resetSel:()=>{const t=document.getElementById('rt').value,l=document.getElementById('rl').value;let keys,label;
  if(t.startsWith('c:')){const c=custom(t.slice(2));const ls=l==='*'?c.lessons:c.lessons.filter(x=>x.id===l);label=l==='*'?c.title:ls[0].title;confirmBox('איפוס "'+label+'"?','סימוני "נלמד" יבוטלו'+(l==='*'?' וההתקדמות בכרטיסיות תתאפס':'')+'. התוכן שכתבת נשמר.','איפוס',()=>{ls.forEach(x=>x.done=false);if(l==='*')Object.keys(S.cards).forEach(k=>{if(k.startsWith(t+'#'))delete S.cards[k];});save();toast('אופס');});return;}
  const tr=T[t];keys=(l==='*'?tr.lessons:tr.lessons.filter(x=>x.id==l)).map(x=>lkey(t,x.id));label=l==='*'?tr.title:findLesson(t,l).l.title;
  confirmBox('איפוס "'+label+'"?','הציונים, הסטטוס וההתקדמות בכרטיסיות יימחקו. ההערות והסימניות נשמרות.','איפוס',()=>{resetKeys(keys);toast('אופס');});},
 resetAll:()=>confirmBox('לאפס את כל ההתקדמות?','כל הציונים, הרצף וההתקדמות בכרטיסיות יימחקו. הנושאים שלך, ההערות והסימניות יישארו.','איפוס הכול',()=>{S.lessons={};S.cards={};S.days={};S.last=null;S.custom.forEach(c=>c.lessons.forEach(l=>l.done=false));save();V.quiz=null;go('');toast('ההתקדמות אופסה');},true),
 wipe:()=>confirmBox('למחוק את כל הנתונים?','הכול יימחק מהמכשיר, כולל הנושאים וההערות שלך. אי אפשר לבטל.','מחיקה לצמיתות',()=>{S=DEF();save();applyTheme();V.quiz=null;go('');toast('כל הנתונים נמחקו');},true)
};
function resetKeys(keys){keys.forEach(k=>{delete S.lessons[k];Object.keys(S.cards).forEach(c=>{if(c.startsWith(k+'#'))delete S.cards[c];});if(S.last===k)S.last=null;});if(V.quiz&&keys.includes(V.quiz.k))V.quiz=null;save();}
function rerenderKeep(){const y=window.scrollY;render();window.scrollTo(0,y);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el||el.disabled)return;if(el.dataset.go!=null&&!el.dataset.act){e.preventDefault();go(el.dataset.go);return;}const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset);}});
window.addEventListener('hashchange',render);
window.fillRL=fillRL;

/* ---------- boot ---------- */
function loadScript(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s);});}
(async function boot(){applyTheme();await Promise.all((window.ACADEMY_TRACKS||[]).map(id=>loadScript('content/'+id+'.js')));render();
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script>
